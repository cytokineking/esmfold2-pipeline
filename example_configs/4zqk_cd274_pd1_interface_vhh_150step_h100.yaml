# Full-design follow-up to the 20-step CD274 optimization pilot.
target:
  name: cd274_pd1_interface_4zqk
  structure: ../example_input_structures/4zqk_pd1_pdl1.cif
  chains: [A]
  structure_indexing: auth_seq_id
  hotspots: "A:56,66,113,115,121,123,124,125"
  conditioning:
    mode: distogram

binder:
  scaffold: vhh
  framework: caplacizumab

campaign:
  num_designs: 1
  seed_start: 42
  inversion_model: fast-cutoff2025
  critics:
    - fast-cutoff2025
  steps: 150

loss:
  binder_target_contact_mode: mosaic_cdr
  mosaic_framework_contact_penalty_weight: 1.0
  target_geometry_drift:
    enabled: true

validation:
  top_k: all
  msa:
    use_msa: false
  protenix:
    use_template: true
    n_sample: 1
    n_step: 200
    n_cycle: 10

output: gpu_runs/4zqk_cd274_pd1_interface_vhh_150step_h100
